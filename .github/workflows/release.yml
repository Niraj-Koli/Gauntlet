# On every push to main: run CI, push both images to GHCR tagged with the commit SHA, then
# commit the new tags to values-prod.yaml. Argo CD sees that commit and rolls them out, so
# git is the record of what runs in production.
name: Release

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false # let a rollout finish before the next one starts

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  images:
    name: Push ${{ matrix.image }} image
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image: [api, web]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Image name
        id: name
        # GHCR names must be lowercase; account names needn't be.
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/gauntlet-${{ matrix.image }}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/docker/${{ matrix.image }}.Dockerfile
          push: true
          tags: |
            ${{ steps.name.outputs.image }}:${{ github.sha }}
            ${{ steps.name.outputs.image }}:main
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  deploy:
    name: Point production at the new images
    needs: images
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Update values-prod.yaml
        env:
          TAG: ${{ github.sha }}
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          export API="ghcr.io/$owner/gauntlet-api" WEB="ghcr.io/$owner/gauntlet-web"
          yq -i '.image.api.repository = strenv(API) | .image.api.tag = strenv(TAG) |
                 .image.web.repository = strenv(WEB) | .image.web.tag = strenv(TAG)' \
            deploy/helm/gauntlet/values-prod.yaml
          git diff --stat
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Deploy ${GITHUB_SHA::7} to production [skip ci]"
          git pull --rebase origin main # in case main moved on while the images built
          git push origin HEAD:main
