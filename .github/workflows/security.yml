# Known vulnerabilities in dependencies and images, risky deployment config, and secrets in
# git history. On pull requests, on main, and weekly, since new advisories appear for code
# that hasn't changed. Accepted findings are listed, with reasons, in .trivyignore.yaml and
# SECURITY.md.
name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1" # Mondays
  workflow_dispatch:

permissions:
  contents: read

env:
  UV_VERSION: "0.12.3"
  NODE_VERSION: "24"
  TRIVY_IMAGE: aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa
  GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f

jobs:
  dependencies:
    name: Dependency audit (pip-audit, npm audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
      - name: Python dependencies
        # The ignored IDs are the litellm proxy-server advisories in .trivyignore.yaml.
        run: |
          uv export --locked --no-dev --no-emit-workspace --format requirements-txt > requirements.txt
          ignored=(PYSEC-2026-388 PYSEC-2026-391 PYSEC-2026-2598 PYSEC-2026-2599 PYSEC-2026-2600
                   PYSEC-2026-2601 PYSEC-2026-2602 PYSEC-2026-3476 PYSEC-2026-3477 PYSEC-2026-3479
                   PYSEC-2026-3861 PYSEC-2026-4066 PYSEC-2026-4067 PYSEC-2026-4070)
          uvx pip-audit -r requirements.txt --disable-pip --no-deps --progress-spinner off \
            "${ignored[@]/#/--ignore-vuln=}"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Web dependencies (what ships; dev tooling is reported, not blocking)
        working-directory: apps/web
        run: |
          npm audit --omit=dev --audit-level=high
          npm audit --audit-level=critical || true

  secrets:
    name: Secrets in git history (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: docker run --rm -v "$PWD:/repo" "$GITLEAKS_IMAGE" git /repo --no-banner --redact --verbose

  config:
    name: Deployment config (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Dockerfiles, compose and the Helm chart with production values
        run: |
          docker run --rm -v "$PWD:/repo:ro" "$TRIVY_IMAGE" config --quiet --exit-code 1 \
            --severity HIGH,CRITICAL,MEDIUM --ignorefile /repo/.trivyignore.yaml \
            --helm-values /repo/deploy/helm/gauntlet/values-prod.yaml /repo

  images:
    name: Image scan (${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [api, web]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/docker/${{ matrix.image }}.Dockerfile
          tags: gauntlet-${{ matrix.image }}:scan
          load: true
          cache-from: type=gha,scope=${{ matrix.image }}
      - name: Fixable high and critical vulnerabilities, and secrets baked into layers
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/repo:ro" "$TRIVY_IMAGE" \
            image --quiet --exit-code 1 --scanners vuln,secret --severity HIGH,CRITICAL --ignore-unfixed \
            --ignorefile /repo/.trivyignore.yaml "gauntlet-${{ matrix.image }}:scan"
