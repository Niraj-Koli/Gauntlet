# Install once with: uv run pre-commit install
# Ruff, pyright and pytest run from the project's own venv, so their versions follow uv.lock.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        # Helm templates are Go templates that render to YAML, not YAML themselves.
        exclude: ^deploy/(helm/gauntlet|argocd/apps)/templates/
      - id: check-toml
      - id: check-added-large-files
        exclude: ^(uv\.lock|apps/web/package-lock\.json|apps/web/src/lib/api-schema\.d\.ts|docs/demo\.gif)$
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: pyright
        name: pyright
        entry: uv run pyright
        language: system
        types: [python]
        pass_filenames: false
      - id: pytest
        name: pytest
        entry: uv run pytest -q
        language: system
        types: [python]
        pass_filenames: false
      - id: web-lint
        name: web lint
        entry: npm --prefix apps/web run lint
        language: system
        files: ^apps/web/
        pass_filenames: false
      - id: web-typecheck
        name: web typecheck
        entry: npm --prefix apps/web run typecheck
        language: system
        files: ^apps/web/
        pass_filenames: false
