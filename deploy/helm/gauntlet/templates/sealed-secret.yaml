{{- if .Values.sealedSecret.encryptedData }}
# Decrypted in the cluster by the Sealed Secrets controller into the Secret the pods read.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: {{ .Values.existingSecret }}
  labels:
    {{- include "gauntlet.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  encryptedData:
    {{- toYaml .Values.sealedSecret.encryptedData | nindent 4 }}
  template:
    metadata:
      name: {{ .Values.existingSecret }}
      labels:
        {{- include "gauntlet.labels" . | nindent 8 }}
{{- end }}
