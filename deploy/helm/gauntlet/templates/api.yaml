{{- $component := "api" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "gauntlet.fullname" . }}-api
  labels:
    {{- include "gauntlet.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  {{- if not .Values.api.autoscaling.enabled }}
  replicas: {{ .Values.api.replicas }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "gauntlet.selectorLabels" (list . $component) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "gauntlet.selectorLabels" (list . $component) | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      {{- include "gauntlet.podDefaults" . | nindent 6 }}
      containers:
        - name: api
          image: {{ include "gauntlet.image" (list . "api") }}
          imagePullPolicy: {{ .Values.image.api.pullPolicy }}
          {{- include "gauntlet.backendEnv" . | nindent 10 }}
          ports:
            - name: http
              containerPort: 8000
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 3
            failureThreshold: 40
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: data, mountPath: /data }
      volumes:
        - { name: tmp, emptyDir: {} }
        - { name: data, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "gauntlet.apiHost" . }}
  labels:
    {{- include "gauntlet.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  selector:
    {{- include "gauntlet.selectorLabels" (list . $component) | nindent 4 }}
  ports:
    - name: http
      port: 8000
      targetPort: http
{{- if .Values.api.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "gauntlet.fullname" . }}-api
  labels:
    {{- include "gauntlet.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "gauntlet.fullname" . }}-api
  minReplicas: {{ .Values.api.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.api.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.api.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}
{{- with .Values.api.podDisruptionBudget }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "gauntlet.fullname" $ }}-api
  labels:
    {{- include "gauntlet.labels" $ | nindent 4 }}
spec:
  minAvailable: {{ .minAvailable }}
  selector:
    matchLabels:
      {{- include "gauntlet.selectorLabels" (list $ $component) | nindent 6 }}
{{- end }}
