# The one manifest applied by hand (deploy/scripts/bootstrap-argocd.sh does it); everything
# else is in git and synced by Argo CD. The script fills in the repository and environment.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gauntlet-root
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: ${REPO_URL}
    targetRevision: ${REVISION}
    path: deploy/argocd/apps
    helm:
      valuesObject:
        repoURL: ${REPO_URL}
        targetRevision: ${REVISION}
        env: ${GAUNTLET_ENV}
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
